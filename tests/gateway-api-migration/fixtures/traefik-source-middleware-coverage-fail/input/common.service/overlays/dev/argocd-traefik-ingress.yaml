apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: traefik-cors@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts: ["argocd.dev.example.com"]
    secretName: argocd-server-tls
  rules:
  - host: argocd.dev.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80
