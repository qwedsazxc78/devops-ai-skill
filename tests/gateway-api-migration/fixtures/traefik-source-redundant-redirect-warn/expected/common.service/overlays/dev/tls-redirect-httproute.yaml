apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tls-redirect
  namespace: argocd
spec:
  parentRefs:
  - name: app-gateway
    namespace: gateway
  hostnames:
  - argocd.dev.example.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        port: 443
        statusCode: 301
