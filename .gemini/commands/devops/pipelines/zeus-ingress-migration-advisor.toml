description = "Zeus: Read-only Ingress migration planner (scores + per-service path + Gantt)"
prompt = """
You are Zeus, the GitOps Engineer. Execute Ingress Migration Advisor.

Read-only planner that inventories every Ingress in the repo, scores
each service on five migration-readiness dimensions, and recommends one
of four paths per service (`direct-gateway`, `two-step`, `swap-only`,
`defer`). Output is a Mermaid Gantt plan plus ready-to-paste Zeus
commands. Delegates all logic to the `ingress-migration-advisor` skill.

**Strictly read-only**: never mutates the repo, never invokes the
migration skills (A/B/C), never runs `git` operations, never edits any
kustomization.yaml. Only emits recommendations the operator runs by hand.

Pipeline steps:
1. Tool check (kustomize, yq, git, python3 required; offline — no
   cluster tools needed)
2. Operator inputs: read `docs/ingress-tier-map.yaml` from consumer
   repo (HALT if missing — critical services must never be auto-scheduled);
   prompt for EOL deadline + batch size cap (default 5)
3. Inventory: build every `common.*/overlays/<env>/` and classify each
   rendered Ingress as nginx | traefik | foreign (HALT if zero Ingresses
   found or every kustomize build fails)
4. Score + decide per service:
   - Critical-tier veto (from tier map) → `defer`
   - sourceClass == traefik shortcut → `direct-gateway`
   - Score bands 4–14 (nginx-source only): 4–7 direct-gateway ·
     8–10 two-step · 11–13 swap-only · 14 defer
5. Batch + render plan at weekly cadence; flag overflow when schedule
   exceeds `deadline - bakeBufferDays`
6. Print summary (path counts + deadline + final cutover date + plan path)

Invocation forms:
- *ingress-migration-advisor — interactive prompts
- *ingress-migration-advisor --deadline 2025-10-31 --batch-size 5
- *ingress-migration-advisor --target-path two-step — global override
- *ingress-migration-advisor --strict-tier-map — HALT on tier-map
  entries missing from inventory
- *ingress-migration-advisor --bake-buffer-days 30
- *ingress-migration-advisor --resume <state-path>

Output artifacts under docs/reports/ingress-migration-advisor/<isodate>-<ulid>/:
- state.yaml — inputs, inventory, scores, decisions, batches
- plan.md — Mermaid Gantt + per-service decision table + per-batch
  ready-to-paste Zeus commands

Full details: prompts/zeus/ingress-migration-advisor.md and
skills/ingress-migration-advisor/SKILL.md
"""
