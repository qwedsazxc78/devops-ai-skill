# HTTPRoute template — filled in by gateway-api-migration skill per minion.
#
# Substitution variables (set by scripts/build_report.py or inline by the skill):
#   {{service}}              — minion's backend Service name (also used as HTTPRoute name)
#   {{namespace}}            — minion's effective namespace
#   {{hostname}}             — minion's declared host for this env
#   {{gateway_name}}         — name of the generated Gateway resource (usually "common-gateway")
#   {{gateway_namespace}}    — namespace of the Gateway (usually master's namespace, e.g. "ingress-nginx")
#   {{listener_name}}        — Gateway listener name matching this hostname (must exist on the Gateway)
#
# Repeating blocks (the skill emits one copy per source path rule):
#   {{rules_block}}          — expands to one `- matches: ... backendRefs: ...` entry per (path, pathType, backend) tuple
#   {{response_header_filters}} — optional ResponseHeaderModifier block with X-* headers from master server-snippet (row 9a)
#   {{traefik_middleware_refs}} — Traefik target only: list of ExtensionRef filters for CORS, path-denylist, etc.
#                                 Expands to 0+ entries under rules[].filters[] when target family is traefik.
#
# The generated HTTPRoute MUST validate under `kustomize build` before
# the skill proceeds to Step 4. `apiVersion` is always `v1` (GA); do
# not emit `v1beta1` — see references/http-routing-guide.md.
#
# Traefik target — example filters block with two Middleware references:
#   filters:
#     - type: ExtensionRef
#       extensionRef:
#         group: traefik.io
#         kind: Middleware
#         name: common-cors
#     - type: ExtensionRef
#       extensionRef:
#         group: traefik.io
#         kind: Middleware
#         name: block-sensitive-paths
#     - type: ResponseHeaderModifier
#       responseHeaderModifier:
#         add:
#           - name: X-Content-Type-Options
#             value: nosniff
#           # ... (row 9a security headers)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{service}}
  namespace: {{namespace}}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{gateway_name}}
      namespace: {{gateway_namespace}}
      sectionName: {{listener_name}}
  hostnames:
    - {{hostname}}
  rules:
    # One entry per (path, pathType, backend) tuple from the source minion.
    # PathType maps: Ingress `Prefix` → HTTPRoute `PathPrefix`,
    #                Ingress `Exact`  → HTTPRoute `Exact`.
    # `ImplementationSpecific` → keep literal value, flag in report.
    #
    # Example rule entry (repeated per path):
    - matches:
        - path:
            type: PathPrefix          # or Exact, per source pathType
            value: /                  # from source `paths[].path`
      # Optional response-header filter from master server-snippet (row 9a).
      # The skill emits this block ONLY when the master Ingress had one of
      # X-Content-Type-Options / X-XSS-Protection / X-Frame-Options in
      # server-snippet annotation. Otherwise omit the `filters:` stanza.
      #
      # filters:
      #   - type: ResponseHeaderModifier
      #     responseHeaderModifier:
      #       add:
      #         - name: X-Content-Type-Options
      #           value: nosniff
      #         - name: X-XSS-Protection
      #           value: "1; mode=block"
      #         - name: X-Frame-Options
      #           value: SAMEORIGIN
      backendRefs:
        - group: ""
          kind: Service
          name: {{backend_name}}      # from source `backend.service.name`
          port: {{backend_port}}      # numeric port; resolve from Service if source uses `port.name`
          # weight: 1                 # omit unless doing traffic splitting; enables canaries later
---
# HTTP→HTTPS redirect HTTPRoute (generated once per Gateway when any
# hostname has a port 80 listener). Lives alongside the service HTTPRoutes
# in common.service/overlays/<env>/ and attaches to the `http` listener.
# The redirect covers every hostname in one HTTPRoute; per-hostname copies
# are unnecessary.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tls-redirect
  namespace: {{namespace}}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{gateway_name}}
      namespace: {{gateway_namespace}}
      sectionName: http
  hostnames:
    # {{all_hostnames}} expands to the full list of hostnames from this env
    - {{hostname}}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
