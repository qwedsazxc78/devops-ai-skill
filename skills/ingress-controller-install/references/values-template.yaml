# Traefik Helm values — parameterized template
#
# Rendered by skill `ingress-controller-install` Step 5.
# Placeholders use the form ${VAR_NAME}; the skill substitutes literally.
#
# Coexistence model: this template assumes an existing ingress-nginx
# controller continues to serve traffic. Traefik claims a *distinct*
# IngressClass and a *distinct* LoadBalancer IP. It does NOT register
# itself as the default IngressClass.
#
# Env-specific tweaks (replicas, resources, loglevel) are gated by
# ${ENV}; review the env block below before rolling to prd.

# ---------------------------------------------------------------------------
# IngressClass
# ---------------------------------------------------------------------------
ingressClass:
  enabled: true
  name: ${INGRESS_CLASS_NAME}
  # CRITICAL: keep `false`. Setting `true` would steal the default class
  # from ingress-nginx and silently reroute every Ingress with no
  # `ingressClassName` set.
  isDefaultClass: false

# ---------------------------------------------------------------------------
# Providers
# ---------------------------------------------------------------------------
providers:
  kubernetesIngress:
    enabled: true
    # Only watch Ingress resources that opt in to our class.
    ingressClass: ${INGRESS_CLASS_NAME}
    # publishedService propagates the LB IP into Ingress status, which
    # external-dns and cert-manager rely on.
    publishedService:
      enabled: true
  kubernetesGateway:
    # Opt-in. When true, Traefik also reconciles Gateway API resources
    # (HTTPRoute, GRPCRoute, TLSRoute). Requires the Gateway API CRDs
    # to be installed on the cluster first.
    enabled: ${GATEWAY_API_ENABLED}

# ---------------------------------------------------------------------------
# Entrypoints
# ---------------------------------------------------------------------------
# Traefik pods listen on 8000/8443 internally; the Service maps them to
# 80/443 externally. This means two controllers can run on the same node
# without port conflicts at the pod level.
ports:
  web:
    port: 8000
    exposedPort: 80
    expose:
      default: true
    protocol: TCP
    redirectTo:
      port: websecure
      priority: 10
  websecure:
    port: 8443
    exposedPort: 443
    expose:
      default: true
    protocol: TCP
    tls:
      enabled: true
  traefik:
    # Internal dashboard / metrics port — never exposed via the LB.
    port: 9000
    expose:
      default: false

# ---------------------------------------------------------------------------
# Service (LoadBalancer)
# ---------------------------------------------------------------------------
service:
  enabled: true
  type: LoadBalancer
  # NOTE: `spec.loadBalancerIP` is deprecated in Kubernetes >= 1.24. On
  # GKE Standard clusters it still works; on Autopilot / newer providers
  # swap this for an annotation (e.g. GCP:
  # networking.gke.io/load-balancer-type and a pre-reserved address name).
  spec:
    loadBalancerIP: ${LB_IP}
  annotations: {}

# ---------------------------------------------------------------------------
# Deployment shape (env-specific)
# ---------------------------------------------------------------------------
# These defaults are conservative. Override in env-specific values files
# if the operator splits values per env.
deployment:
  enabled: true
  kind: Deployment
  # ${ENV} = dev  -> 1 replica
  # ${ENV} = stg  -> 2 replicas
  # ${ENV} = prd  -> 3 replicas
  # The skill renders the literal number based on ${ENV}; leave the
  # placeholder unsubstituted if you intend to manage replicas via HPA.
  replicas: 2

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logs:
  general:
    # Use INFO in prd, DEBUG in dev. The skill substitutes when ${ENV}
    # is known; otherwise leave INFO.
    level: INFO
  access:
    enabled: true
    format: json

# ---------------------------------------------------------------------------
# Metrics / dashboard
# ---------------------------------------------------------------------------
metrics:
  prometheus:
    enabled: true
    addEntryPointsLabels: true
    addServicesLabels: true

# The dashboard is OFF by default. If enabled, gate it behind an Ingress
# with auth — the skill never enables this automatically.
ingressRoute:
  dashboard:
    enabled: false

# ---------------------------------------------------------------------------
# Pod security
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
    add: ["NET_BIND_SERVICE"]
  readOnlyRootFilesystem: true
